# PIE Job Agent - job discovery configuration.
#
# Everything the crawler searches for lives here; nothing is hardcoded in adapters.
# Discovery is read-only: it only reads public job listings through official, documented
# endpoints, identifies itself with a User-Agent, and waits between requests.

search:
  # Matched against job titles as whole words (case-insensitive).
  terms:
    - Software Engineer
    - Software Developer
    - SDE
    - AI Engineer
    - ML Engineer
    - Data Engineer
    - Data Scientist
    - Backend Engineer
  # Extra phrasings that count as the same search term.
  term_aliases:
    SDE: [Software Development Engineer, SDE I, SDE II, SDE 1, SDE 2]
    ML Engineer: [Machine Learning Engineer, MLE]
    AI Engineer: [Applied AI Engineer, GenAI Engineer, Generative AI Engineer, LLM Engineer]
    Backend Engineer: [Back End Engineer, Back-End Engineer, Backend Developer, Backend Software Engineer]
    # Early-career phrasings are accepted as the same role family. A "junior"/"associate"
    # title is only a search match: Claude's analysis still decides actual fit.
    Software Engineer: [Software Engineering, Member of Technical Staff, Graduate Engineer,
                        Graduate Engineer Trainee, Engineer Trainee, Associate Engineer,
                        Junior Engineer, Engineer I, New Grad Engineer]
    Software Developer: [Application Developer, Junior Developer, Associate Developer,
                         Graduate Developer]
    Data Engineer: [Data Platform Engineer, Analytics Engineer]
  # Scope: anywhere in India, plus remote roles open to India. A posting takes the FIRST
  # location it matches, so the preferred NCR places come first; "India" then covers the rest
  # of the country (it also matches NCR postings, so NCR can never fall out of scope).
  locations:
    - Gurugram
    - Noida
    - Delhi NCR
    - Remote
    - India
  # Regex patterns (case-insensitive) matched against a posting's location text.
  location_patterns:
    Gurugram: ["gurugram", "gurgaon"]
    Noida: ["noida"]
    Delhi NCR: ["\\bdelhi\\b", "\\bncr\\b", "faridabad", "ghaziabad"]
    # Only remote roles that name India. A bare "Remote" on these boards was US-only in
    # practice (USD pay); add "^\\s*remote\\s*$" to this list to include those anyway.
    Remote: ["remote.{0,20}india", "india.{0,20}remote"]
    # The word "India" (not "Indiana", "Indian Ocean"...) or an Indian city/state that boards
    # often list without the country. Hyderabad, Pakistan is not India.
    India: ["\\bindia\\b", "\\bbharat\\b",
            "\\bbengaluru\\b", "\\bbangalore\\b", "\\bhyderabad\\b(?!.{0,30}pakistan)",
            "\\bpune\\b", "\\bmumbai\\b", "\\bthane\\b", "\\bchennai\\b", "\\bkolkata\\b",
            "\\bahmedabad\\b", "\\bgandhinagar\\b", "\\bjaipur\\b", "\\bkochi\\b", "\\bcochin\\b",
            "\\bthiruvananthapuram\\b", "\\btrivandrum\\b", "\\bcoimbatore\\b", "\\bindore\\b",
            "\\bchandigarh\\b", "\\bmohali\\b", "\\bmysuru\\b", "\\bmysore\\b", "\\bvadodara\\b",
            "\\bnagpur\\b", "\\bbhubaneswar\\b", "\\bvisakhapatnam\\b", "\\blucknow\\b",
            "\\bkarnataka\\b", "\\btelangana\\b", "\\bmaharashtra\\b", "\\btamil nadu\\b",
            "\\bkerala\\b", "\\bharyana\\b", "\\buttar pradesh\\b", "\\bgujarat\\b",
            "\\bwest bengal\\b"]

